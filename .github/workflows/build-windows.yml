name: Compilar instalador Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar .exe e instalador
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar ejecutable con PyInstaller
        run: pyinstaller desktop_app.spec --clean --noconfirm

      - name: Instalar Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Crear carpeta de salida
        run: New-Item -ItemType Directory -Force -Path installer\output
        shell: pwsh

      - name: Compilar instalador con Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\seace_buscador.iss
        shell: pwsh

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SEACEBuscador-Windows-Installer
          path: installer\output\*.exe
          retention-days: 90

      - name: Publicar Release en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SEACE Buscador ${{ github.ref_name }}"
          body: |
            ## Instalacion
            1. Descarga **SEACEBuscador_Setup_1.0.0.exe**
            2. Doble clic → Siguiente → Siguiente → Instalar → Finalizar
            3. Se crea un icono en el Escritorio
            No se requiere instalar Python ni ningun otro programa.
          files: installer/output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
